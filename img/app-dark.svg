<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Calendar base (lighter for dark theme) -->
  <rect x="8" y="12" width="48" height="44" rx="4" fill="#42a5f5" opacity="0.9"/>
  
  <!-- Calendar header -->
  <rect x="8" y="12" width="48" height="12" rx="4" fill="#2196f3"/>
  <rect x="8" y="20" width="48" height="4" fill="#2196f3"/>
  
  <!-- Calendar rings -->
  <rect x="16" y="8" width="4" height="8" rx="2" fill="#1976d2"/>
  <rect x="44" y="8" width="4" height="8" rx="2" fill="#1976d2"/>
  
  <!-- Calendar grid dots -->
  <circle cx="18" cy="32" r="2" fill="white" opacity="0.6"/>
  <circle cx="28" cy="32" r="2" fill="white" opacity="0.6"/>
  <circle cx="38" cy="32" r="2" fill="white" opacity="0.6"/>
  <circle cx="48" cy="32" r="2" fill="white" opacity="0.6"/>
  
  <circle cx="18" cy="40" r="2" fill="white" opacity="0.6"/>
  <circle cx="28" cy="40" r="2" fill="white" opacity="0.6"/>
  <circle cx="38" cy="40" r="2" fill="white" opacity="0.6"/>
  <circle cx="48" cy="40" r="2" fill="white" opacity="0.6"/>
  
  <circle cx="18" cy="48" r="2" fill="white" opacity="0.6"/>
  <circle cx="28" cy="48" r="2" fill="white" opacity="0.6"/>
  
  <!-- Checkmark circle background (brighter green) -->
  <circle cx="44" cy="46" r="12" fill="#66bb6a"/>
  <circle cx="44" cy="46" r="11" fill="#4caf50"/>
  
  <!-- Checkmark -->
  <path d="M 38 46 L 42 50 L 50 42" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
